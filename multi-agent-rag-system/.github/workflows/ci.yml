name: CI

on:
  push:
    branches: [main]
    paths:
      - "multi-agent-rag-system/**"
  pull_request:
    branches: [main]
    paths:
      - "multi-agent-rag-system/**"

defaults:
  run:
    working-directory: multi-agent-rag-system

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff mypy
      - name: Lint with ruff
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: multi-agent-rag-system/coverage.xml
        if: always()

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t multi-agent-rag-system:test .
      - name: Verify container starts
        run: |
          docker run -d --name test-app \
            -e AZURE_OPENAI_API_KEY=test \
            -e AZURE_OPENAI_ENDPOINT=https://test.openai.azure.com/ \
            -e AZURE_SEARCH_ENDPOINT=https://test.search.windows.net \
            -e AZURE_SEARCH_API_KEY=test \
            multi-agent-rag-system:test
          sleep 5
          docker logs test-app
          docker stop test-app
